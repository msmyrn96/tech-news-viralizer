services:
  - type: web
    name: tech-news-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: worker
    name: tech-news-worker
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: python -m worker.main
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
